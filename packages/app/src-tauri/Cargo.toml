[package]
name = "chimera-app"
version = "0.1.5"
description = "Chimera desktop cockpit"
edition = "2021"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# W6 packaging: focus the existing window instead of a second instance; open
# transcript images in the OS viewer (commands::open_image).
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# CWD-PICKER: native folder/file picker for cwd fields (ScheduleFormCard/
# SpawnCard/TeamFormCard/ImportCard) — packages/app/src/components/PathPicker.tsx.
tauri-plugin-dialog = "2"
base64 = "0.22"
# IN-APP-TERMINAL: cross-platform PTY (the crate WezTerm uses). The master read is
# blocking, so each session owns a std::thread rather than a tokio task.
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# daemon.rs: UDS client (net), line framing (io-util), pending/state channels
# (sync), backoff + timeouts (time). rt/macros are pulled in for the dev-time
# integration tests; tauri's async_runtime provides the production runtime.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
dirs = "6"
dunce = "1"
tempfile = "3"

[dev-dependencies]
