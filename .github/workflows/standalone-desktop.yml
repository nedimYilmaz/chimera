name: Standalone desktop candidates

# macOS releases use the local Developer ID/keychain profile with the same build script.
# This builds test candidates, not public releases; Windows signing remains a release gate.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native installer to build and test
        type: choice
        options: [linux, windows]
        required: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'ubuntu-22.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: npm install --global pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - run: node scripts/audit-secrets.mjs
      - run: cargo test --lib --manifest-path packages/app/src-tauri/Cargo.toml
      - run: node scripts/build-standalone-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ inputs.platform }}-x64-candidate
          path: dist/standalone/*
          if-no-files-found: error
