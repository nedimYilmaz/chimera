packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  # Explicit denials are required by pnpm 11's strict build policy. Leaving a
  # package undecided stops install, even though its scripts are not executed.
  onnxruntime-node: false
  protobufjs: false
# pnpm 11's 1-day minimumReleaseAge gate, knowingly waived for the Claude agent
# SDK bump that was taken within a day of publish (0.3.289 and its native
# binaries, published 2026-10-03). Entries are exact versions, so they widen
# nothing for future releases; drop them on the next SDK bump. The Codex SDK/CLI
# 0.160.0 pair was already past the gate when taken and needs no exclusion.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.289'
  - '@anthropic-ai/claude-agent-sdk@0.3.289'
# Security pins for transitive dependencies whose parents still pin vulnerable
# releases. Keep nanoid's CommonJS v3 line separate from ESM v4/v5 consumers.
# Review/removal criteria and the remaining upstream ZIP advisory:
# docs/DEPENDENCY-SECURITY.md.
overrides:
  'nanoid@<4': '3.3.18'
  'nanoid@>=4 <6': '5.1.16'
  'lodash-es@<4.18.1': '4.18.1'
  'fast-uri@>=3 <3.1.8': '3.1.8'
  'ip-address@>=10 <10.7.1': '10.7.1'
  'hono@<4.13.7': '4.13.7'
  '@hono/node-server@<2': '1.19.17'
  'mermaid@>=11 <11.17.2': '11.17.2'
  'dompurify@<3.4.15': '3.4.15'
  'qs@<6.16.0': '6.16.0'
  'sharp@<0.35.4': '0.35.4'
  'adm-zip@<0.6.0': '0.6.0'
  'postcss@>=8 <8.5.23': '8.5.23'
  'browserslist@<4.28.7': '4.28.7'
  'baseline-browser-mapping@<2.11.21': '2.11.21'
patchedDependencies:
  onnxruntime-node@1.24.3: patches/onnxruntime-node@1.24.3.patch
