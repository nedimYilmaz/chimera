packages:
  - "packages/*"
allowBuilds:
  esbuild: true
  # Explicit denials are required by pnpm 11's strict build policy. Leaving a
  # package undecided stops install, even though its scripts are not executed.
  onnxruntime-node: false
  protobufjs: false
# Reviewed SDK releases requested for this refresh are inside the one-day age gate.
# Exceptions are exact versions; future releases still wait for normal review.
minimumReleaseAgeExclude:
  - '@openai/codex-sdk@0.167.1'
  - '@openai/codex@0.167.1-darwin-arm64 || 0.167.1-darwin-x64 || 0.167.1-linux-arm64 || 0.167.1-linux-x64 || 0.167.1-win32-arm64 || 0.167.1-win32-x64 || 0.167.1'
  - '@agentclientprotocol/sdk@2.6.0'
  - '@hono/node-server@2.1.7'
# Security pins for transitive dependencies whose parents still pin vulnerable
# releases. Keep nanoid's CommonJS v3 line separate from ESM v4/v5 consumers.
# Review/removal criteria and the remaining upstream ZIP advisory:
# docs/DEPENDENCY-SECURITY.md.
overrides:
  'nanoid@<4': '3.3.18'
  'nanoid@>=4 <6': '5.1.16'
  'lodash-es@<4.18.1': '4.18.1'
  'fast-uri@>=3 <3.1.9': '3.1.9'
  'ip-address@>=10 <10.7.4': '10.7.4'
  'hono@<4.13.11': '4.13.11'
  '@hono/node-server@<2.1.3': '2.1.7'
  'mermaid@>=11 <11.17.2': '11.17.2'
  'dompurify@<3.4.17': '3.4.17'
  'qs@<6.16.1': '6.17.1'
  'sharp@<0.35.5': '0.35.5'
  'adm-zip@<0.6.1': '0.6.1'
  'postcss@>=8 <8.5.23': '8.5.23'
  'browserslist@<4.28.7': '4.28.7'
  'baseline-browser-mapping@<2.11.21': '2.11.21'
  'katex@<0.18.2': '0.18.2'
  'source-map-js@<1.2.2': '1.2.2'
  'proxy-addr@<2.0.8': '2.0.8'
  'body-parser@>=2 <2.4.0': '2.4.0'
  'vite@>=7 <7.3.7': '7.3.8'
  'vite@>=8 <8.1.6': '8.3.8'
patchedDependencies:
  onnxruntime-node@1.24.3: patches/onnxruntime-node@1.24.3.patch
